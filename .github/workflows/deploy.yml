name: Deploy MyTeX website

on:
  repository_dispatch:
    types: [deploy-website]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mytex-public-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
      SOURCE_ASSET_ID: ${{ github.event.client_payload.asset_id }}
      SOURCE_ASSET_SHA256: ${{ github.event.client_payload.asset_sha256 }}
    steps:
      - name: Validate staged source identity
        shell: bash
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ || ! "$SOURCE_ASSET_ID" =~ ^[1-9][0-9]*$ || ! "$SOURCE_ASSET_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Expected a source SHA, staging asset ID and SHA-256'
            exit 1
          fi
      - name: Download and verify temporary Pages source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${SOURCE_ASSET_ID}" \
            -H 'Accept: application/octet-stream' > pages-source.zip
          python - <<'PY'
          import hashlib
          import os
          import zipfile
          from pathlib import Path, PurePosixPath

          payload = Path('pages-source.zip').read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['SOURCE_ASSET_SHA256']:
              raise SystemExit('Pages source checksum mismatch')
          target = Path('source').resolve()
          target.mkdir()
          with zipfile.ZipFile('pages-source.zip') as archive:
              for item in archive.infolist():
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename:
                      raise SystemExit(f'Unsafe archive path: {item.filename}')
                  destination = (target / Path(*path.parts)).resolve()
                  if target not in destination.parents and destination != target:
                      raise SystemExit(f'Archive path escaped staging root: {item.filename}')
              archive.extractall(target)
          PY
      - name: Verify website source
        run: |
          cd source
          python scripts/verify_documentation.py
          test "$(cat docs/CNAME)" = 'mytex.app'
          test -s docs/index.html
          test -s docs/versions/index.html
          test -z "$(find docs -type l -print -quit)"
      - name: Prepare Pages artifact
        run: |
          mkdir public
          cp -a source/docs/. public/
          touch public/.nojekyll
      - uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
